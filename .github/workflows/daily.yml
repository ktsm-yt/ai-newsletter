name: daily

# JST 07:00 = UTC 22:00。workflow_dispatch も残して手動再実行可能にする。
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Sync deps (frozen)
        run: uv sync --frozen

      # Star snapshot は repo に commit せず Actions cache で永続化 (log ノイズ回避)。
      # run_id key で必ず保存 → restore-keys で前回最新を復元。
      - name: Restore GitHub stars snapshot
        uses: actions/cache@v4
        with:
          path: data/github_stars.json
          key: github-stars-${{ github.run_id }}
          restore-keys: |
            github-stars-

      - name: Run daily newsletter
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: uv run python scripts/daily.py
