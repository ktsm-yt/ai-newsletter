name: daily

# M1 v0.1 中は workflow_dispatch のみ。
# D.1 で cron 起動 (UTC 22:00 = JST 07:00) を有効化する:
#   schedule:
#     - cron: '0 22 * * *'
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Sync deps (frozen)
        run: uv sync --frozen

      - name: Send hello to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: uv run python scripts/send_hello.py
