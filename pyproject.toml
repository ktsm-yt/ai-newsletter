[project]
name = "ai-newsletter"
version = "0.1.0"
description = "Daily AI dev newsletter to Slack (overseas sources, JP summary)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.6.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_newsletter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "respx>=0.23.1",
]
